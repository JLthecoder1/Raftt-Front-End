<!doctype html>
<html lang="en">
  <head>
    <script src="assets/js/shared/routes.js"></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Raftt password recovery." />
    <title>Reset password | RAFTT</title>
    <link rel="stylesheet" href="assets/css/style.css" />
    <link rel="stylesheet" href="assets/css/workflows.css" />
    <script src="assets/js/shared/app-language.js?v=18" defer></script>
    <link rel="stylesheet" href="assets/css/shared-footer.css" />
    <script src="assets/js/shared/shared-footer.js" defer></script>
    <link rel="stylesheet" href="assets/css/brand-theme.css" />
    <script src="assets/js/shared/brand-theme.js" defer></script>
    <script src="assets/js/shared/page-metadata.js" defer></script>
    <script src="assets/js/shared/number-format.js"></script>
    <script src="assets/js/vendor/supabase.min.js"></script>
    <script src="assets/js/backend/config.js"></script>
    <script src="assets/js/backend/client.js?v=21"></script>
  </head>
  <body class="login-page">
    <main class="login-shell">
      <section class="login-panel" aria-labelledby="reset-title">
        <div class="login-form-wrap">
          <a class="login-home-link" href="welcome.html">← Back to website</a>
          <p class="login-kicker">ACCOUNT ACCESS</p>
          <h1 id="reset-title">Reset your password.</h1>
          <p class="login-intro">Enter your account email to receive a password recovery link.</p>
          <p class="workflow-notice" role="note">The recovery link will be sent to your email.</p>
          <form class="login-form" id="reset-form">
            <label for="reset-email">Email address</label>
            <input
              id="reset-email"
              name="email"
              type="email"
              autocomplete="email"
              placeholder="you@example.com"
              required
            />
            <button class="login-submit" type="submit">
              Send recovery link <span aria-hidden="true">→</span>
            </button>
            <p class="login-status" id="reset-status" role="status" aria-live="polite"></p>
          </form>
          <p class="login-signup"><a href="login.html">Return to sign in</a></p>
        </div>
        <aside class="login-story signup-story" aria-label="Raftt account access">
          <div class="login-story-media" aria-hidden="true"></div>
          <div class="login-story-glow"></div>
          <div class="login-story-content">
            <p class="story-label">PRIVATE MARKETS · TOGETHER</p>
            <blockquote>Account access for the journey ahead.</blockquote>
            <p class="story-author"><strong>Raftt</strong><br />Account recovery</p>
          </div>
        </aside>
      </section>
    </main>

    <script src="assets/js/backend/gate.js?v=19"></script>
    <script src="assets/js/backend/auth-forms.js"></script>
    <script src="assets/js/media/avatar-display.js"></script>
    <script src="assets/js/shared/environment-status.js?v=18"></script>
  </body>
</html>
