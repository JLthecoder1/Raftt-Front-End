                <a class="dashboard-nav-link" href="welcome.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z" /></svg><span>Dashboard</span></a>

            </div>
        </aside>

        <main class="map-stage" aria-label="Investment map">
            <canvas id="map-canvas" aria-label="3D ocean map with eight investment islands"></canvas>
            <div id="map-labels"></div>
            <div id="raft-marker" class="raft-marker">Your RAFTT</div>
            <button class="dashboard-menu-toggle map-menu" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="dashboard-sidebar"><span></span><span></span><span></span></button>
            <div class="map-tools">
                <button id="lang-toggle" type="button" aria-label="Language">PT</button>
                <button id="zoom-in" type="button" aria-label="Zoom in">+</button>
                <button id="zoom-out" type="button" aria-label="Zoom out">&minus;</button>

            </div>
            <p id="map-hint" class="map-hint"></p>
            <div class="dpad" aria-label="Directional controls">
                <button data-k="u" aria-label="Up">&#9650;</button><button data-k="l" aria-label="Left">&#9664;</button><button data-k="d" aria-label="Down">&#9660;</button><button data-k="r" aria-label="Right">&#9654;</button>
            </div>
            <section id="opportunity-menu" class="opportunity-menu" hidden aria-labelledby="opportunity-menu-title">
                <header class="opportunity-menu__header">
                    <div><h2 id="opportunity-menu-title"></h2><p id="opportunity-menu-subtitle"></p></div>
                    <button id="opportunity-menu-close" type="button" aria-label="Close opportunities menu">&times;</button>
                </header>
                <div id="opportunity-menu-list" class="opportunity-menu__list" role="list"></div>
            </section>
            <div id="loading" class="loading"><div><strong>RAFTT</strong><p id="loading-text"></p><div class="bar"><i id="loading-bar"></i></div></div></div>
        </main>

    </div>
    <script src="assets/js/welcome.js"></script>
    <script type="importmap">{"imports":{"three":"./assets/js/vendor/three.module.min.js"}}</script>
