<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>Confirmar acesso | RAFTT</title>
    <link rel="stylesheet" href="assets/css/style.css" />
    <link rel="stylesheet" href="assets/css/brand-theme.css" />
    <script src="assets/js/shared/app-language.js?v=18" defer></script>
    <script src="assets/js/vendor/supabase.min.js"></script>
    <script src="assets/js/backend/config.js"></script>
    <script src="assets/js/backend/client.js?v=21"></script>
  </head>
  <body class="login-page">
    <main class="login-shell">
      <section class="login-panel">
        <div class="login-form-wrap">
          <a href="/welcome" class="login-home-link">RAFTT</a>
          <h1 id="callback-heading">Confirmando acesso…</h1>
          <p id="callback-status" role="status" aria-live="polite"></p>
          <form id="new-password-form" class="login-form" hidden>
            <label for="new-password">Nova senha</label
            ><input
              id="new-password"
              type="password"
              minlength="8"
              autocomplete="new-password"
              required
            />
            <label for="confirm-password">Confirmar senha</label
            ><input
              id="confirm-password"
              type="password"
              minlength="8"
              autocomplete="new-password"
              required
            />
            <button type="submit" class="login-submit" id="password-submit">Salvar senha</button>
          </form>
          <a href="/login" id="callback-login" hidden>Voltar ao login</a>
        </div>
      </section>
    </main>
    <script src="assets/js/auth/password-rules.js"></script>
    <script src="assets/js/backend/callback.js"></script>
    <script src="assets/js/media/avatar-display.js"></script>
    <script src="assets/js/shared/environment-status.js?v=18"></script>
  </body>
</html>
