<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <link rel="stylesheet" href="Style.css">
    </head>

    <body>
        <header class="site-header">
            <a class="brand" href="#track" aria-label="Raftt - início">
                <img src="Imagens/raftt-logo.png" alt="Raftt">
            </a>
            <nav class="primary-nav" aria-label="Navegação principal">
                <span class="nav-highlight" aria-hidden="true"></span>
                <a class="nav-link" href="#track">Explore</a>
                <a class="nav-link is-selected" href="#track">How it works</a>
                <a class="nav-link" href="#track">Resources</a>
                <a class="nav-link" href="#track">About</a>
            </nav>
            <a class="call-button" href="#track">Get Started</a>
        </header>
        <div class="loader" id="loader"></div>
        <div class="progress" id="progress"></div>
        <div class="hint" id="hint" role="status" aria-live="polite"></div>
        <main class="scroll-track" id="track">
            <div class="stage">
                <img class="start-image" id="start-image" src="Imagens/Foto Abertura.png" alt="Ilustração de uma navegante cruzando o mar entre ilhas">
                <video
                    src="Imagens/Navegante.mp4"
                    id="vid"
                    muted
                    playsinline
                    preload="auto"
                    aria-label="Vídeo controlado pela rolagem"
                ></video>
            </div>
        </main>
        <script src="gsap.min.js"></script>
        <script src="ScrollTrigger.min.js"></script>
        <script src="Main.js"></script>
    </body>
</html>
